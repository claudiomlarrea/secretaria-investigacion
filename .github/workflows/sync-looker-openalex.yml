# Actualiza automáticamente la planilla Looker (indice_openalex) desde OpenAlex.
# Requiere secreto GOOGLE_SA_JSON en el repositorio (ver LOOKER-AUTO-SETUP.txt).

name: Sync Looker OpenAlex

on:
  schedule:
    # Todos los días 10:00 UTC (~07:00 Argentina)
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements-looker-sync.txt

      - name: Credenciales Google
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ -z "$GOOGLE_SA_JSON" ]; then
            echo "::error::Falta el secreto GOOGLE_SA_JSON. Ver LOOKER-AUTO-SETUP.txt"
            exit 1
          fi
          echo "$GOOGLE_SA_JSON" > "${RUNNER_TEMP}/google-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/google-sa.json" >> "$GITHUB_ENV"

      - name: Sincronizar OpenAlex → Sheets
        env:
          LOOKER_SHEET_ID: "10SKDfZJIZGSTOaOWgGmB46WPM0Bd0BvLe4aZ9jilA34"
          LOOKER_SHEET_TAB: "indice_openalex"
          LOOKER_YEAR_FROM: "2020"
        run: python3 scripts/sync_looker_to_sheets.py

name: Streamlit app check

on:
  push:
    branches: [main]
    paths:
      - "eph_analisis/**"
      - "views/eph_indec.py"
      - "streamlit_app.py"
      - "requirements.txt"
  pull_request:
    paths:
      - "eph_analisis/**"
      - "views/eph_indec.py"
      - "streamlit_app.py"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import EPH engine
        working-directory: eph_analisis
        run: python -c "from src.engine import procesar_solicitud; from src.request import SolicitudAnalisis"

      - name: Streamlit headless smoke
        env:
          MPLCONFIGDIR: /tmp/mpl
        run: |
          timeout 15 streamlit run streamlit_app.py --server.headless true --server.port 8501 &
          sleep 8
          curl -sf http://localhost:8501/_stcore/health

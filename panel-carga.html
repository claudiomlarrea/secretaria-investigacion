<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carga de Publicaciones · Secretaría de Investigación</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/publicaciones-config.js?v=5"></script>
  </head>
  <body>
    <main class="section" style="padding: 3rem 1.25rem">
      <div class="section-inner" style="max-width: 40rem">
        <h1>Carga de publicaciones</h1>
        <p>
          El panel del equipo ahora se abre en Google Apps Script. Tenés que
          estar conectado con un correo autorizado
          (<code>investigacion@uccuyo.edu.ar</code>, etc.).
        </p>
        <p id="panel-redirect">Redirigiendo…</p>
        <p>
          <a id="panel-link" class="btn btn-primary" href="#">Abrir panel del equipo</a>
          ·
          <a class="btn btn-ghost" href="index.html#publicaciones">Volver al sitio</a>
        </p>
      </div>
    </main>
    <script>
      (function () {
        var cfg = window.SEC_PUBLICACIONES || {};
        var base = String(cfg.APPS_SCRIPT_URL || "").trim();
        var url = base
          ? base + (base.indexOf("?") >= 0 ? "&" : "?") + "action=admin"
          : "index.html#publicaciones";
        var a = document.getElementById("panel-link");
        var msg = document.getElementById("panel-redirect");
        if (a) a.href = url;
        if (base) {
          window.location.replace(url);
        } else if (msg) {
          msg.textContent = "Falta APPS_SCRIPT_URL en publicaciones-config.js";
        }
      })();
    </script>
  </body>
</html>
